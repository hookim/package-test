name: 배포

on:
  push:
    branches:
      - changesets

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@${{ github.repository_owner }}"
          cache: npm

      - name: 의존성 설치하기
        run: npm install

      - name: .npmrc 파일 생성하기
        run: |
          cat << EOF > "$HOME/.npmrc"
          //npm.pkg.github.com/:_authToken=${{ secrets.GH_ACCESS_TOKEN }}
          @${{ github.repository_owner }}:registry=https://npm.pkg.github.com
          EOF
      - name: dummy changeset 생성하기
        run: |
          mkdir -p .changeset
          CHANGESET=".changeset/ci-snapshot-$(date +%s).md"
          cat > "$CHANGESET" << 'EOF'
          ---
          "@hookim/package-test": patch
          ---

          dummy
          EOF
          echo "Created $CHANGESET (runner only)"
          cat "$CHANGESET"

      - name: snapshot 릴리즈 배포하기
        run: npm run release-dev
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: 스냅샷 배포 내용중 최신 2개를 제외하고 삭제 (방금 업데이트 포함)
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          owner: "hookim"
          package-name: "package-test"
          package-type: "npm"
          min-versions-to-keep: 2
          ignore-versions: '^[0-9]+\.[0-9]+\.[0-9]+$'
          token: ${{ secrets.GH_ACCESS_TOKEN }}
